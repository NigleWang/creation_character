couple_id: tom_james
display_name: Tom & James

characters:
  shou: tom    # 受
  gong: james  # 攻

dynamic:
  type: romantic male couple
  tone: natural, cinematic, intimate but restrained

character_roles:
  tom:
    role: shou
    keywords: [calm, gentle, reserved, receptive]
    default_scene_side: left

  james:
    role: gong
    keywords: [warm, confident, protective, leading]
    default_scene_side: right

interaction_patterns:
  - walking together
  - eye contact across table
  - James arm around Tom
  - quiet domestic moments
  - subtle physical contact
  - Tom leaning into James

binding_rules:
  - LEFT person in scene → Tom unless user explicitly says otherwise
  - RIGHT person in scene → James unless user explicitly says otherwise
  - NEVER swap Tom and James faces or roles
  - Tom is always 受 energy; James is always 攻 energy
  - If scene has one person only, use the @mentioned character's bible

emotion_rules:
  - natural not staged
  - cinematic film photography feel
  - intimate but tasteful for Xiaohongshu
