  - direct or slightly averted calm gaze
  - almost no smile
  - neat short crop

negative_identity:
  - do not add browline glasses or a buzz cut
  - do not change the crop into spiky hair or a receding messy cut
  - do not bulk the body up to 大海
  - do not copy the gray six-view backdrop or panel grid
  - do not merge with Teo, Kai, or 大海

reference_images:
